name: 🚀 Autonomous Programmatic AI Vitrina Generator (Every 3 Hours)

on:
  schedule:
    - cron: '0 */3 * * *' # Run automatically every 3 hours (~8 times/day = 100-160 pages/day)
  workflow_dispatch: # Manual one-click trigger button in GitHub Actions tab

jobs:
  run-programmatic-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Microservices Pipeline Orchestrator
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY || secrets.GROQ_API_KEY || secrets.OPENAI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node services/pipeline-orchestrator.mjs
